<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill</title>
    <style>
        :root {
            --bg-color: #050a14;
            --accent-blue: #00d2ff;
            --deep-blue: #004e92;
            --text-color: #ffffff;
            --glow-color: rgba(0, 210, 255, 0.5);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Subtle tech background effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 50% 50%, var(--deep-blue) 0%, transparent 70%),
                linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            z-index: -1;
            opacity: 0.3;
        }

        .container {
            text-align: center;
        }

        .bill-button {
            display: inline-block;
            padding: 25px 80px;
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-color);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(135deg, var(--deep-blue) 0%, #002d5a 100%);
            border: 2px solid var(--accent-blue);
            border-radius: 12px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px var(--glow-color);
            cursor: pointer;
            overflow: hidden;
        }

        .bill-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .bill-button:hover::before {
            left: 100%;
        }

        .bill-button:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 0 40px var(--accent-blue), inset 0 0 15px var(--accent-blue);
            text-shadow: 0 0 10px var(--text-color);
            background: linear-gradient(135deg, #005bb5 0%, var(--deep-blue) 100%);
        }

        .bill-button:active {
            transform: scale(0.98) translateY(0);
        }

        /* Ambient animation */
        @keyframes pulse {
            0% { box-shadow: 0 0 20px var(--glow-color); }
            50% { box-shadow: 0 0 35px var(--glow-color); }
            100% { box-shadow: 0 0 20px var(--glow-color); }
        }

        .bill-button {
            animation: pulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://shaheennamboori.github.io/bill" class="bill-button">BILL</a>
    </div>
</body>
</html>
